name: Feature request
description: Suggest an improvement for mcp-guard
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real secrets in examples.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or detection gap should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Fake examples
      description: Include fake values only.
      render: shell
