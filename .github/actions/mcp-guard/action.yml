name: mcp-guard
description: Scan MCP and AI-agent configs for leaked secrets before they reach GitHub.
author: Chirag Borse

inputs:
  path:
    description: File or directory to scan.
    required: false
    default: "."
  fail-on:
    description: Minimum severity that should fail the workflow.
    required: false
    default: "high"
  sarif:
    description: Optional SARIF output path.
    required: false
    default: ""
  staged:
    description: Scan only staged Git files.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pipx
      shell: bash
      run: python -m pip install --user pipx
    - name: Run mcp-guard
      shell: bash
      env:
        MCP_GUARD_PATH: ${{ inputs.path }}
        MCP_GUARD_FAIL_ON: ${{ inputs.fail-on }}
        MCP_GUARD_SARIF: ${{ inputs.sarif }}
        MCP_GUARD_STAGED: ${{ inputs.staged }}
      run: |
        args=("${MCP_GUARD_PATH}" "--fail-on" "${MCP_GUARD_FAIL_ON}")
        if [ -n "${MCP_GUARD_SARIF}" ]; then
          args+=("--sarif" "${MCP_GUARD_SARIF}")
        fi
        if [ "${MCP_GUARD_STAGED}" = "true" ]; then
          args+=("--staged")
        fi
        python -m pipx run --spec mcp-secrets-guard mcp-guard "${args[@]}"
