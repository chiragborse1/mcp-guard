[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mcp-guard"
version = "0.5.0"
description = "Scan projects for AI and MCP-related secrets before they leak."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Chirag Borse" }
]
keywords = ["mcp", "security", "secrets", "cli", "scanner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chiragborse1/mcp-guard"
Repository = "https://github.com/chiragborse1/mcp-guard"
Issues = "https://github.com/chiragborse1/mcp-guard/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
